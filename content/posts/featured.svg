<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg">
<style>
  /* three posts crossfade on the screen — 9s loop, each visible ~3s */
  .slide { opacity: 0; animation: cycle 9s ease-in-out infinite; }
  .slide.s1 { animation-delay: 3s; }
  .slide.s2 { animation-delay: 6s; }
  @keyframes cycle {
    0%   { opacity: 0; transform: translateY(6px); }
    5%   { opacity: 1; transform: translateY(0); }
    30%  { opacity: 1; transform: translateY(0); }
    36%  { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 0; transform: translateY(-6px); }
  }

  .livedot { animation: livePulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(1.35); }
  }

  .cursor { animation: blink 1.3s steps(1) infinite; }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  .netnode { animation: nodeGlow 2.6s ease-in-out infinite; }
  .netnode.g1 { animation-delay: 0.35s; }
  .netnode.g2 { animation-delay: 0.7s; }
  @keyframes nodeGlow {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  .scan { animation: scanMove 5s linear infinite; }
  @keyframes scanMove {
    from { transform: translateY(-8px); }
    to   { transform: translateY(150px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { opacity: 1 !important; }
    .slide.s1, .slide.s2 { opacity: 0 !important; }
    * { animation: none !important; }
  }
</style>

<defs>
  <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#30363d"/>
    <stop offset="100%" stop-color="#21262d"/>
  </linearGradient>
  <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#30363d"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="thumb" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1f6feb"/>
    <stop offset="100%" stop-color="#2861c9"/>
  </linearGradient>
  <radialGradient id="screenGlow" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <clipPath id="screenClip">
    <rect x="86" y="52" width="288" height="164" rx="5"/>
  </clipPath>
</defs>

<circle cx="230" cy="150" r="190" fill="url(#ambientGlow)"/>

<!-- ===== stand ===== -->
<ellipse cx="230" cy="296" rx="72" ry="9" fill="#000000" opacity="0.4" filter="url(#softShadow)"/>
<rect x="216" y="238" width="28" height="44" fill="url(#standGrad)"/>
<rect x="176" y="280" width="108" height="12" rx="6" fill="url(#standGrad)" stroke="#30363d" stroke-width="1"/>

<!-- ===== monitor body ===== -->
<rect x="74" y="40" width="312" height="200" rx="12" fill="url(#bezel)" stroke="#484f58" stroke-width="1.2"/>
<rect x="86" y="52" width="288" height="164" rx="5" fill="#0d1117"/>

<!-- ===== screen content ===== -->
<g clip-path="url(#screenClip)">
  <rect x="86" y="52" width="288" height="164" fill="url(#screenGlow)"/>

  <!-- header bar, static -->
  <rect x="86" y="52" width="288" height="26" fill="#161b22"/>
  <circle class="livedot" cx="102" cy="65" r="4" fill="#3fb950"/>
  <rect x="114" y="62" width="58" height="5" rx="2.5" fill="#484f58"/>
  <rect x="330" y="62" width="30" height="5" rx="2.5" fill="#21262d"/>
  <line x1="86" y1="78" x2="374" y2="78" stroke="#30363d" stroke-width="1"/>

  <!-- Post 1: terminal -->
  <g class="slide">
    <rect x="106" y="94" width="104" height="72" rx="6" fill="url(#thumb)"/>
    <rect x="122" y="108" width="72" height="44" rx="4" fill="#0d1117"/>
    <rect x="122" y="108" width="72" height="9" rx="4" fill="#21262d"/>
    <circle cx="129" cy="112.5" r="1.5" fill="#484f58"/>
    <circle cx="135" cy="112.5" r="1.5" fill="#484f58"/>
    <circle cx="141" cy="112.5" r="1.5" fill="#484f58"/>
    <path d="M129 126 L135 131 L129 136" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="140" y="125" width="9" height="11" rx="1" fill="#3fb950"/>

    <rect x="228" y="98" width="118" height="7" rx="3.5" fill="#79c0ff"/>
    <rect x="228" y="116" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="126" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="136" width="82" height="4.5" rx="2.2" fill="#30363d"/>
    <circle cx="232" cy="158" r="3.2" fill="#8b949e"/>
    <rect x="240" y="156" width="34" height="4.5" rx="2.2" fill="#484f58"/>
    <rect x="300" y="151" width="46" height="14" rx="7" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  </g>

  <!-- Post 2: networking -->
  <g class="slide s1">
    <rect x="106" y="94" width="104" height="72" rx="6" fill="url(#thumb)"/>
    <line x1="158" y1="112" x2="140" y2="140" stroke="#0d1117" stroke-width="2.2"/>
    <line x1="158" y1="112" x2="176" y2="140" stroke="#0d1117" stroke-width="2.2"/>
    <line x1="140" y1="140" x2="176" y2="140" stroke="#0d1117" stroke-width="2.2"/>
    <circle class="netnode" cx="158" cy="112" r="7" fill="#0d1117" stroke="#79c0ff" stroke-width="2.2"/>
    <circle class="netnode g1" cx="140" cy="140" r="7" fill="#0d1117" stroke="#79c0ff" stroke-width="2.2"/>
    <circle class="netnode g2" cx="176" cy="140" r="7" fill="#0d1117" stroke="#79c0ff" stroke-width="2.2"/>
    <circle cx="158" cy="112" r="2.4" fill="#3fb950"/>

    <rect x="228" y="98" width="118" height="7" rx="3.5" fill="#79c0ff"/>
    <rect x="228" y="116" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="126" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="136" width="82" height="4.5" rx="2.2" fill="#30363d"/>
    <circle cx="232" cy="158" r="3.2" fill="#8b949e"/>
    <rect x="240" y="156" width="34" height="4.5" rx="2.2" fill="#484f58"/>
    <rect x="300" y="151" width="46" height="14" rx="7" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  </g>

  <!-- Post 3: cloud -->
  <g class="slide s2">
    <rect x="106" y="94" width="104" height="72" rx="6" fill="url(#thumb)"/>
    <path d="M136 144 A12 12 0 0 1 139 120 A17 17 0 0 1 173 117 A13.5 13.5 0 0 1 176 144 Z" fill="#0d1117"/>

    <rect x="228" y="98" width="118" height="7" rx="3.5" fill="#79c0ff"/>
    <rect x="228" y="116" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="126" width="128" height="4.5" rx="2.2" fill="#30363d"/>
    <rect x="228" y="136" width="82" height="4.5" rx="2.2" fill="#30363d"/>
    <circle cx="232" cy="158" r="3.2" fill="#8b949e"/>
    <rect x="240" y="156" width="34" height="4.5" rx="2.2" fill="#484f58"/>
    <rect x="300" y="151" width="46" height="14" rx="7" fill="#0d1117" stroke="#388bfd" stroke-width="1"/>
  </g>

  <!-- faint scanline sweep for screen feel -->
  <rect class="scan" x="86" y="52" width="288" height="8" fill="#79c0ff" opacity="0.05"/>
</g>

</svg>
